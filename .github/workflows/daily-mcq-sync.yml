name: Daily NCERT Quiz (20 MCQs) Sync

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional back-date YYYY-MM-DD (leave blank for Today IST)'
        required: false
        default: ''
      rebuild_existing_pdfs:
        description: 'Re-render ALL existing PDFs (0 AI calls)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '7 0 * * *'
    - cron: '37 0 * * *'
    - cron: '11 1 * * *'
    - cron: '43 1 * * *'

permissions:
  contents: write

jobs:
  generate-daily-ncert-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WeasyPrint, Devanagari fonts, and requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libffi-dev shared-mime-info fonts-noto-core fonts-lohit-deva
          pip install -q requests weasyprint

      - name: Run Daily NCERT Quiz (20 MCQs) Sync
        env:
          QUIZ_MODE: ncert
          QUIZ_GEMINI_API_KEY: ${{ secrets.QUIZ_GEMINI_API_KEY }}
          QUIZ_GROQ_API_KEY: ${{ secrets.QUIZ_GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          REBUILD_EXISTING_PDFS: ${{ github.event.inputs.rebuild_existing_pdfs }}
          WEBSITE_URL: https://www.eternalcivilacademy.com
        run: python3 automation_workers/daily_mcq_sync.py
