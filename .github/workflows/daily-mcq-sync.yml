name: Daily NCERT Quiz (20 MCQs) Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  generate-daily-25mcq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WeasyPrint, Devanagari fonts, and requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libffi-dev shared-mime-info fonts-noto-core fonts-lohit-deva
          pip install -q requests weasyprint

      - name: Generate 20-MCQ Daily NCERT Quiz and Branded EN/HI PDFs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSITE_URL: https://www.eternalcivilacademy.com
        run: python3 automation_workers/daily_mcq_sync.py
