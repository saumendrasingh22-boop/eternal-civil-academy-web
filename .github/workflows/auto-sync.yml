name: ECA 24x7 Free National & State Current Affairs Auto-Sync

on:
  schedule:
    # Runs automatically every 4 hours forever (100% Free & Unlimited on public GitHub Actions)
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: eca-auto-sync
  cancel-in-progress: false

jobs:
  stealth-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r automation_workers/requirements.txt

      - name: Run Multi-Source National & State Current Affairs Auto-Sync
        env:
          ECA_WEBSITE_API_URL: ${{ secrets.ECA_WEBSITE_API_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation_workers/stealth_auto_sync.py
